[workspace]
members = [
    "rsf-core",
    "rsf-cli",
    "nustage",
    "zed-sheet-lsp",
    "git-sheets", "warranty-pipeline",
]
exclude = ["spreadsheet-format", "spreadsheet-turso"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Core Stack:
# - rsf-core (semantic model for tabular data, no deps)
# - nustage (pipeline engine, depends on rsf-core optionally)
# - zed-sheet-lsp (Zed LSP integration, depends on nustage + rsf-core)
# - git-sheets (version control for spreadsheets, depends on rsf-core)
# - rsf-cli (representation/analysis CLI, depends on rsf-core)

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
sha256 = "0.1"
chardet = "0.3"
